<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poki School</title>
    <style>
        /* Asegura que el contenedor raíz ocupe el 100% real de la pantalla */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Elimina barras de desplazamiento residuales */
            background-color: #000;
            /* Fondo negro por estética gaming */
        }

        /* Fuerza al iframe a rellenar la pantalla de forma independiente */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            /* 100% del ancho del viewport */
            height: 100vh;
            /* 100% del alto del viewport */
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <iframe src="https://steal-brainrots.1games.io/"
        allow="autoplay; fullscreen; camera; focus-without-user-activation *; monetization; gamepad; keyboard-map *; xr-spatial-tracking; clipboard-write; web-share; accelerometer; magnetometer; gyroscope; display-capture"
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts allow-same-origin allow-downloads"
        allowfullscreen>
    </iframe>
</body>

</html>
